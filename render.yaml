services:
  - type: web
    name: subwrench-mcp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run http
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
  - type: web
    name: subwrench-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run bot
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BOT_TOKEN
        sync: false
